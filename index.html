<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Big Sister">
<title>Big Sister School</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFE9F2">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3B2A5A}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;font-family:'Fredoka',ui-rounded,system-ui,sans-serif;color:var(--ink);background:#FFE9F2;transition:background-color .4s}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;margin:0}
#wrap{position:fixed;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;overflow:hidden}
#stage,.scene{position:absolute;inset:0}
.scene{overflow:hidden}
svg{display:block;overflow:visible}
.abs{position:absolute}
.char svg,.fit svg{width:100%;height:auto}
.box svg{width:100%;height:100%}
.hidden{display:none!important}

/* rooms */
.room-start{background:#FFE9F2}
.room-path{background:#DFF5EC}
.room-nursery{background:linear-gradient(#E6DDFB 0 548px,#FFFFFF 548px 566px,#F2D3A8 566px)}
.room-night{background:linear-gradient(#3E4486 0 548px,#6E73B8 548px 566px,#50508F 566px)}
.room-living{background:linear-gradient(#FFE7A6 0 548px,#FFFFFF 548px 566px,#E9C48F 566px)}
.room-bath{background-color:#CDEFE6;background-image:linear-gradient(rgba(255,255,255,.55) 3px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.55) 3px,transparent 3px);background-size:60px 60px}
.floor{position:absolute;left:0;right:0;top:548px;bottom:0;background:linear-gradient(#FFFFFF 0 18px,transparent 18px),repeating-linear-gradient(90deg,#F2D3A8 0 146px,#E6C493 146px 150px)}
.window{position:absolute;border:10px solid #fff;border-radius:26px;background:#BFE4F7;overflow:hidden}
.window.night{background:#26306A}
.window .cloud{position:absolute;height:26px;border-radius:999px;background:#fff}
.window .sun{position:absolute;width:32px;height:32px;border-radius:50%;background:#FFD84D}
.window .wmoon{position:absolute;width:40px;height:40px}
.window .twk{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.pcloud{position:absolute;height:40px;border-radius:999px;background:#fff;pointer-events:none}

/* top bar */
.topbar{position:absolute;left:32px;right:32px;top:24px;display:flex;justify-content:space-between;align-items:center;z-index:40;pointer-events:none}
.topbar>*{pointer-events:auto}
.topbar.off{display:none}
.rbtn{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 0 rgba(59,42,90,.14)}
.rbtn svg{width:36px;height:36px}
.rbtn:active,.stop:active,.choice:active,.play:active{translate:0 4px}
.pill{background:#fff;border-radius:999px;padding:10px 26px;font-size:28px;font-weight:600;box-shadow:0 6px 0 rgba(59,42,90,.12)}
.rightgrp{display:flex;gap:14px;align-items:center}
.stickers{display:flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:12px 18px;box-shadow:0 6px 0 rgba(59,42,90,.12)}
.stickers i{width:24px;height:24px;border-radius:50%;background:#EDE7F6;display:grid;place-items:center}
.stickers i svg{width:14px;height:14px}
.stickers i.pop{animation:popin .6s cubic-bezier(.2,1.8,.4,1)}

/* start */
.startTitle{position:absolute;left:0;right:0;top:110px;text-align:center;font-size:66px;font-weight:700}
.play{position:absolute;left:470px;top:480px;width:240px;height:240px;border-radius:50%;background:#FF7EB6;display:grid;place-items:center;box-shadow:inset 0 -14px 0 rgba(0,0,0,.1),inset 0 10px 0 rgba(255,255,255,.3),0 14px 0 #D9548F;animation:pulse 1.4s ease-in-out infinite}
.play svg{width:110px;height:110px;margin-left:16px}
.grownup{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:19px;opacity:.7}

/* home path */
.road{position:absolute;left:0;top:0;width:1180px;height:820px;pointer-events:none}
.stop{position:absolute;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:inset 0 -10px 0 rgba(0,0,0,.10),inset 0 8px 0 rgba(255,255,255,.3),0 9px 0 var(--d);animation:popin .5s cubic-bezier(.2,1.6,.4,1) backwards}
.stop>svg{width:58px;height:58px}
.badge{position:absolute;right:-8px;top:-8px;width:40px;height:40px;border-radius:50%;background:#FFC94A;border:4px solid #fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(59,42,90,.15)}
.badge svg{width:20px;height:20px}
.ring{position:absolute;width:150px;height:150px;border-radius:50%;border:10px solid #fff;animation:ringPulse 1.4s ease-in-out infinite;pointer-events:none}
.surprise{position:absolute;width:136px;height:136px;border-radius:50%;border:8px solid #fff;background:#FFE6A3;display:grid;place-items:center;box-shadow:0 10px 0 #EBCB74}
.surprise>svg{width:74px;height:74px}
.surprise.ready{animation:glow 1.2s ease-in-out infinite}
.lock{position:absolute;right:-6px;bottom:-6px;width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(59,42,90,.15)}
.lock svg{width:26px;height:26px}
.gear{position:absolute;right:12px;bottom:10px;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;opacity:.45;touch-action:none;z-index:45}
.gear svg{width:30px;height:30px}
.gear.pressing{opacity:1;animation:spin 1.2s linear}

/* characters & props */
.crying{animation:shake .32s ease-in-out infinite alternate;transform-origin:50% 90%}
.tear{transform-box:fill-box;animation:tear 1s ease-in infinite;opacity:0}
.tear.t2{animation-delay:.5s}
.happy{animation:bob 1.3s ease-in-out infinite}
.pop{animation:popin .55s cubic-bezier(.2,1.6,.4,1) backwards}
.wob{animation:shake .12s 8 alternate}
.squeeze{animation:squeeze .5s ease-in-out}
.stink{position:absolute;display:flex;gap:10px}
.stink i{width:10px;height:40px;border-radius:6px;border:4px solid #8BD178;border-color:transparent #8BD178;animation:stink 1.6s ease-in-out infinite}
.stink i:nth-child(2){animation-delay:.4s}.stink i:nth-child(3){animation-delay:.8s}

/* bubbles & targets */
.thought{position:absolute;width:180px;height:180px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 0 rgba(59,42,90,.10);animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.thought .art{width:110px;height:110px}
.thought .art svg{width:100%;height:100%}
.thought::before,.thought::after{content:"";position:absolute;background:#fff;border-radius:50%}
.thought::before{width:36px;height:36px;left:-12px;bottom:12px}
.thought::after{width:18px;height:18px;left:-38px;bottom:-10px}
.thought.flip::before{left:auto;right:-12px}
.thought.flip::after{left:auto;right:-38px}
.target{animation:glow 1.1s ease-in-out infinite!important}
.okbubble{position:absolute;width:90px;height:90px;border-radius:50%;background:#3CCB9A;display:grid;place-items:center;border:6px solid #fff;box-shadow:0 6px 0 rgba(59,42,90,.15)}
.okbubble svg{width:48px;height:48px}

/* choices */
.tray{position:absolute;left:50%;top:614px;transform:translateX(-50%);height:176px;padding:0 36px;border-radius:52px;background:rgba(255,255,255,.9);display:flex;align-items:center;gap:30px;box-shadow:0 10px 30px rgba(59,42,90,.12);z-index:20}
.tray:empty{display:none}
.choice{width:140px;height:128px;border-radius:40px;background:var(--bg,#F4EEFF);box-shadow:inset 0 -10px 0 rgba(0,0,0,.05),0 9px 0 var(--sh,#DCD0F7);display:grid;place-items:center;animation:popin .5s cubic-bezier(.2,1.6,.4,1) backwards;transition:opacity .3s,scale .3s}
.choice .art{width:96px;height:96px}
.choice .art svg{width:100%;height:100%}
.choice.no{animation:no .5s ease-in-out}
.choice.yes{animation:yay .7s ease-in-out;box-shadow:0 0 0 6px #3CCB9A,0 9px 0 var(--sh,#DCD0F7)}
.choice.fade{opacity:.25;scale:.88}
.tray .idea{width:110px;height:110px;animation:bob 1.2s ease-in-out infinite}

/* wash & bath */
.water{position:absolute;border-radius:13px;background:repeating-linear-gradient(180deg,#7fd0ff 0 18px,#d4f0ff 18px 36px);transform-origin:top;transform:scaleY(0);opacity:0;transition:transform .3s,opacity .3s}
.water.on{transform:scaleY(1);opacity:.9;animation:flow .35s linear infinite}
.hands{touch-action:none}
.germ{position:absolute;width:66px;height:66px;transform:translate(-50%,-50%) scale(0);transition:transform .45s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.germ.show{transform:translate(-50%,-50%) scale(1)}
.germ.gone{transform:translate(-50%,-50%) scale(0) rotate(200deg);transition:transform .35s ease-in}
.germ>div{width:100%;height:100%;animation:wig .6s ease-in-out infinite alternate}
.germ svg{width:100%;height:100%}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0 18%,rgba(205,236,255,.85) 45%,rgba(160,210,255,.45));border:3px solid rgba(255,255,255,.95);transform:translate(-50%,-50%);animation:bpop .25s ease-out;pointer-events:none}
.bubble.rinse{transition:transform 1.3s ease-in,opacity 1.3s;transform:translate(-50%,300px);opacity:0}
.layer{position:absolute;inset:0;pointer-events:none}
.towel{position:absolute;width:130px;height:180px;border-radius:0 0 20px 20px;background:repeating-linear-gradient(180deg,#FFB3D1 0 22px,#fff 22px 30px,#FFD84D 30px 52px,#fff 52px 60px);box-shadow:0 8px 0 rgba(59,42,90,.10)}
.towelbar{position:absolute;height:12px;border-radius:6px;background:#C9B8F5}
.towel.wipe{animation:wipe 1.3s ease-in-out}
.duck{animation:bobble 1.6s ease-in-out infinite}
.blanket{position:absolute;border-radius:70px;border:12px solid #fff;background:repeating-conic-gradient(#FFE1EC 0 25%,#FFF5F9 0 50%) 0 0/80px 80px;box-shadow:0 10px 0 rgba(59,42,90,.08)}
.zone{position:absolute;border-radius:50%}

/* lullaby */
.nstar{position:absolute;width:104px;height:104px}
.nstar svg{width:100%;height:100%}
.nstar.hit{animation:yay .45s ease-in-out}
.songdots{position:absolute;left:0;right:0;top:716px;display:flex;justify-content:center;gap:12px}
.songdots i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22)}
.songdots i.on{background:#FFD84D}
.songdots i.gap{width:14px;background:none}

/* feelings & love */
.fbig{position:absolute;left:490px;top:96px;width:200px;height:200px;display:grid;place-items:center}
.fbig>svg{width:200px;height:200px}
.fbig.go{animation:yay .8s ease-in-out}
.fgrid{position:absolute;left:50%;top:330px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,132px);gap:24px}
.fbtn{width:132px;height:132px;border-radius:40px;background:#fff;box-shadow:0 9px 0 rgba(59,42,90,.12);display:grid;place-items:center;animation:popin .5s cubic-bezier(.2,1.6,.4,1) backwards}
.fbtn svg{width:96px;height:96px}
.fbtn.picked{box-shadow:0 0 0 6px #FF7EB6,0 9px 0 rgba(59,42,90,.12)}
.heartbtn{position:absolute;left:530px;top:656px;width:120px;height:120px;animation:beat 1s ease-in-out infinite}
.heartbtn svg,.lheart svg,.bigheart svg{width:100%;height:100%}
.breath{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#fff 0,#c7b8ff 70%);animation:breathe 4.4s ease-in-out}
.lheart{position:absolute;transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.lheart path{transition:fill .4s}
.bigheart{position:absolute;opacity:0;transform:scale(.8);transition:opacity 1s,transform 1s;touch-action:none}
.bigheart.show{opacity:1;transform:scale(1)}
.holdring{position:absolute;border-radius:50%;--p:0;background:conic-gradient(#FF5FA2 calc(var(--p) * 1turn),rgba(255,255,255,.65) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 18px),#000 calc(100% - 16px));mask:radial-gradient(farthest-side,transparent calc(100% - 18px),#000 calc(100% - 16px));pointer-events:none}
.holdzone{position:absolute;touch-action:none;border-radius:50%}

/* reward & finale */
.reward{position:absolute;inset:0;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);z-index:50;animation:fadeIn .4s}
.sticker{position:absolute;left:460px;top:110px;width:260px;height:260px;border-radius:50%;background:var(--c);border:14px solid #fff;display:grid;place-items:center;box-shadow:0 14px 0 rgba(59,42,90,.15),0 30px 50px rgba(59,42,90,.2);animation:starIn 1.1s cubic-bezier(.2,1.5,.4,1) both}
.sticker>svg{width:140px;height:140px}
.sticker .badge{width:78px;height:78px;right:-14px;top:-14px;border-width:6px}
.sticker .badge svg{width:38px;height:38px}
.rbtns{position:absolute;left:0;right:0;top:470px;display:flex;justify-content:center;gap:60px}
.rbtns .rbtn{width:150px;height:150px;animation:popin .5s 1s cubic-bezier(.2,1.6,.4,1) backwards}
.rbtns .rbtn svg{width:72px;height:72px}
.balloon{position:absolute;width:90px;height:150px;animation:rise linear forwards}
.balloon svg{width:100%;height:100%}

/* fx */
#fx{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.conf{position:absolute;top:-30px;width:14px;height:22px;border-radius:4px;animation:fall var(--d) linear forwards}
.floater{position:absolute;width:56px;height:56px;animation:floatUp 1.6s ease-out forwards}
.floater svg{width:100%;height:100%}
.flyer{position:absolute;z-index:70;width:110px;height:110px;transition:transform .7s cubic-bezier(.5,-.3,.5,1.3),opacity .7s;pointer-events:none}
.flyer svg{width:100%;height:100%}

/* settings */
.modal{position:fixed;inset:0;background:rgba(59,42,90,.45);display:grid;place-items:center;z-index:100}
.panel{background:#fff;border-radius:22px;padding:26px;width:min(580px,92vw);max-height:92vh;overflow:auto;font-size:18px;line-height:1.4;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.panel h2{margin:0 0 10px;font-size:26px}
.panel label{display:block;margin:12px 0;font-weight:600}
.panel input,.panel select{display:block;width:100%;margin-top:6px;font:inherit;font-weight:500;padding:10px 12px;border:2px solid #e3dcf5;border-radius:12px;-webkit-user-select:text;user-select:text}
.panel .note{font-size:15px;opacity:.7;margin:8px 0}
.panel .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.panel .btns button{font-weight:600;padding:10px 16px;border-radius:12px;border:2px solid #e3dcf5;background:#f7f4ff}
.panel .btns .primary{background:#9B7BFF;border-color:#9B7BFF;color:#fff;margin-left:auto}
.swatches{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.swatches button{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e3dcf5}
.swatches button.sel{box-shadow:0 0 0 4px #9B7BFF}

/* keyframes */
@keyframes shake{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes tear{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(22px)}}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes popin{0%{transform:scale(0)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.07}}
@keyframes glow{0%,100%{scale:1;filter:drop-shadow(0 0 0 rgba(255,207,58,0))}50%{scale:1.08;filter:drop-shadow(0 0 22px #ffcf3a)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes no{0%,100%{transform:translateX(0)}20%{transform:translateX(-18px)}40%{transform:translateX(18px)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
@keyframes yay{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-6deg)}70%{transform:scale(1.08) rotate(5deg)}100%{transform:scale(1.08)}}
@keyframes flow{to{background-position:0 36px}}
@keyframes wig{from{transform:rotate(-14deg) scale(1)}to{transform:rotate(14deg) scale(1.08)}}
@keyframes bpop{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
@keyframes wipe{0%,100%{transform:none}35%{transform:translateX(-480px) rotate(-12deg)}55%{transform:translateX(-440px) rotate(10deg)}75%{transform:translateX(-480px) rotate(-8deg)}}
@keyframes starIn{0%{transform:scale(0) rotate(-200deg)}100%{transform:scale(1) rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fall{to{transform:translate(var(--x),880px) rotate(var(--r))}}
@keyframes floatUp{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--x),-200px) scale(1.2);opacity:0}}
@keyframes rise{to{transform:translateY(-1100px) rotate(var(--r))}}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.1);opacity:.5}}
@keyframes breathe{0%,100%{transform:scale(.6)}50%{transform:scale(1.1)}}
@keyframes bobble{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes squeeze{50%{transform:scale(.8)}}
@keyframes stink{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"></div>
  <div class="topbar off" id="topbar">
    <div>
      <button class="rbtn" id="homeBtn" aria-label="Home"></button>
      <div class="pill hidden" id="titlePill">Big Sister School</div>
    </div>
    <div class="rightgrp">
      <div class="stickers hidden" id="stickers" aria-label="Stickers"></div>
      <button class="rbtn" id="replayBtn" aria-label="Say it again"></button>
    </div>
  </div>
  <div id="fx"></div>
</div>

<div id="settings" class="modal hidden">
  <div class="panel">
    <h2>Grown-up settings</h2>
    <label>Big sister's name
      <input id="kidName" placeholder="Leave blank to say “big sister”" autocomplete="off" autocapitalize="words">
    </label>
    <label>Baby's name
      <input id="babyName" placeholder="Leave blank to say “Baby”" autocomplete="off" autocapitalize="words">
    </label>
    <label>Skin color<div class="swatches" id="skinSw"></div></label>
    <label>Hair color<div class="swatches" id="hairSw"></div></label>
    <label>Voice<select id="voiceSel"></select></label>
    <label>Voice speed
      <select id="rate"><option value="0.8">Slower</option><option value="0.92">Normal</option><option value="1.02">A little faster</option></select>
    </label>
    <p class="note" id="voiceNote"></p>
    <div class="btns">
      <button id="testVoice">Test voice</button>
      <button id="resetStars">Reset stickers</button>
      <button id="saveSet" class="primary">Done</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const W=1180,H=820,wrap=$('#wrap'),stage=$('#stage'),fx=$('#fx');
const STOP={stop:true};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- fit the 1180x820 stage to any screen ---------- */
let SCALE=1;
function fit(){
  const vw=window.innerWidth,vh=window.innerHeight,s=Math.min(vw/W,vh/H);SCALE=s;
  wrap.style.transform=`translate(${(vw-W*s)/2}px,${(vh-H*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));fit();
function loc(el){const r=el.getBoundingClientRect(),w=wrap.getBoundingClientRect();return{x:(r.left-w.left)/SCALE,y:(r.top-w.top)/SCALE,w:r.width/SCALE,h:r.height/SCALE}}

/* ---------- saved settings ---------- */
const KEY='bigSisterSchool.v2';
const ORDER=['milk','cry','gentle','wash','ask','diaper','bath','lullaby','feel','love'];
const SKINS=['#F7D7C4','#F2C6A0','#E8B48F','#C68863','#A86B4A','#8D5A3C','#5E3B27'];
const HAIRS=['#2B1D14','#5B3A29','#8A5A36','#A0652F','#C98A4B','#E3B55E'];
let S={kid:'',baby:'',rate:0.92,voiceName:'',skin:'#F2C6A0',hair:'#5B3A29',stars:Object.fromEntries(ORDER.map(k=>[k,false]))};
try{
  let d=JSON.parse(localStorage.getItem(KEY)||'null');
  if(!d){const o=JSON.parse(localStorage.getItem('bigSisterSchool.v1')||'null');if(o)d={kid:o.kid||'',baby:o.baby||'',rate:o.rate||0.92,voiceName:o.voiceName||''}}
  if(d)S=Object.assign(S,d,{stars:Object.assign({},S.stars,d.stars||{})});
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const K=()=>S.kid.trim()||'big sister';

let AC=null,master=null;
function initAudio(){
  try{
    if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.32;master.connect(AC.destination)}
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null}
}
function tone(f,dur,o={}){
  if(!AC)return;const {type='sine',vol=.5,at=0,slide=null,attack=.012}=o;
  const t0=AC.currentTime+at,osc=AC.createOscillator(),g=AC.createGain();
  osc.type=type;osc.frequency.setValueAtTime(f,t0);
  if(slide)osc.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+attack);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  osc.connect(g);g.connect(master);osc.start(t0);osc.stop(t0+dur+.05);
}
function noise(dur,o={}){
  if(!AC)return;const {at=0,vol=.3,f=1200,q=.8,type='bandpass'}=o;
  const t0=AC.currentTime+at,len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.08);g.gain.setValueAtTime(vol,t0+Math.max(.1,dur-.25));g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  src.connect(fl);fl.connect(g);g.connect(master);src.start(t0);src.stop(t0+dur+.05);
}
const NOTES={C:523.25,D:587.33,E:659.25,F:698.46,G:783.99,A:880};
const sfx={
  ding(){[1047,1319,1568].forEach((f,i)=>tone(f,.4,{type:'triangle',vol:.35,at:i*.09}))},
  fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i===5?.8:.22,{type:'triangle',vol:.35,at:i*.14}))},
  boing(){tone(360,.45,{vol:.45,slide:130})},
  pop(){tone(rnd(450,800),.09,{vol:.28,slide:1500})},

  water(d=1.6){noise(d,{f:1700,q:.5,vol:.28})},

  burp(){if(!AC)return;tone(115,.6,{type:'sawtooth',vol:.35,slide:62});noise(.5,{f:220,q:2,vol:.25,type:'lowpass'})},
  giggle(){[1100,900,1150,950].forEach((f,i)=>tone(f,.1,{type:'triangle',vol:.18,at:i*.12,slide:f*1.2}))},
  quack(){tone(520,.18,{type:'square',vol:.12,slide:300});tone(500,.18,{type:'square',vol:.12,slide:280,at:.22})},
  note(f){tone(f,1.1,{vol:.34,attack:.02});tone(f*2,.7,{type:'triangle',vol:.05,attack:.02})},
  cry(){
    if(!AC)return;
    [0,.8].forEach(d=>{
      const t0=AC.currentTime+d,o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
      o.type='sawtooth';f.type='lowpass';f.frequency.value=1500;l.frequency.value=9;lg.gain.value=18;l.connect(lg);lg.connect(o.frequency);
      o.frequency.setValueAtTime(430,t0);o.frequency.linearRampToValueAtTime(640,t0+.25);o.frequency.linearRampToValueAtTime(390,t0+.66);
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.22,t0+.06);g.gain.setValueAtTime(.22,t0+.45);g.gain.exponentialRampToValueAtTime(.0001,t0+.72);
      o.connect(f);f.connect(g);g.connect(master);o.start(t0);l.start(t0);o.stop(t0+.78);l.stop(t0+.78);
    });

    'C C G G A A G - F F E E D D C'.split(' ').forEach((k,i)=>{if(k!=='-')tone(NOTES[k],(i===6||i===14)?.9:.45,{vol:.22,at:i*.44,attack:.04})});

/* ---------- voice ---------- */
const hasTTS='speechSynthesis' in window;
let voice=null,curFinish=null,lastPrompt='';
const SYS_VOICE='__system__'; // "System default": leave the voice unset so the OS picks (on iPad: Settings → Accessibility → Spoken Content → Voices)
const NOVELTY=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Fred|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/i;
function voiceRank(v){let r=0;if(/premium/i.test(v.name))r-=300;else if(/enhanced/i.test(v.name))r-=200;if(/en[-_]US/i.test(v.lang))r-=20;if(/^(Ava|Zoe|Samantha|Allison|Susan|Evan|Nathan|Tom|Joelle|Noelle)/i.test(v.name))r-=10;return r}
function englishVoices(){if(!hasTTS)return[];return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)&&!NOVELTY.test(v.name)).sort((a,b)=>voiceRank(a)-voiceRank(b)||a.name.localeCompare(b.name))}
function pickVoice(){if(!hasTTS)return;if(S.voiceName===SYS_VOICE){voice=null}else{const vs=englishVoices();voice=(S.voiceName&&vs.find(v=>v.name===S.voiceName))||vs[0]||null}fillVoiceList()}
function fillVoiceList(){
  const sel=$('#voiceSel');if(!sel)return;const vs=englishVoices();
  sel.innerHTML=`<option value="${SYS_VOICE}">System default (from device settings)</option>`+vs.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}">${v.name}${/premium|enhanced/i.test(v.name)?' ★':''} — ${v.lang}</option>`).join('');
  sel.value=(S.voiceName===SYS_VOICE||!voice)?SYS_VOICE:voice.name;
}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function stopSpeech(){const f=curFinish;curFinish=null;if(f)f();if(hasTTS){try{speechSynthesis.cancel()}catch(e){}}}
function say(text,o={}){
  return new Promise(res=>{
    stopSpeech();
    const words=text.split(/\s+/).length,rate=(o.rate||S.rate);
    let done=false,to=null;
    const fin=()=>{if(done)return;done=true;clearTimeout(to);if(curFinish===fin)curFinish=null;res()};
    curFinish=fin;
    if(!hasTTS){to=setTimeout(fin,600+words*380);return}
    const u=new SpeechSynthesisUtterance(text);
    if(voice){u.voice=voice;u.lang=voice.lang} // no voice → no lang either, so the OS default voice is used (page is lang="en")
    u.rate=rate;u.pitch=o.pitch||1.12;u.volume=1;u.onend=fin;u.onerror=fin;
    to=setTimeout(fin,2500+words*650/rate);
    try{speechSynthesis.speak(u)}catch(e){fin()}
  });
}

/* ---------- scene plumbing ---------- */
const ROOMBG={start:'#FFE9F2',path:'#DFF5EC',nursery:'#F2D3A8',night:'#50508F',living:'#E9C48F',bath:'#F2D3A8'};
let TOK=0,timers=[];
function newScene(html,{room='nursery',home=false,bar=true}={}){
  TOK++;stopSpeech();
  timers.forEach(id=>{clearTimeout(id);clearInterval(id)});timers=[];
  stage.innerHTML=`<div class="scene room-${room}">${html}</div>`;
  document.body.style.backgroundColor=ROOMBG[room]||'#FFE9F2';
  $('#topbar').classList.toggle('off',!bar);
  $('#homeBtn').classList.toggle('hidden',home);
  $('#titlePill').classList.toggle('hidden',!home);
  $('#stickers').classList.toggle('hidden',!home);
  return TOK;
}
async function speak(t,text,o){if(t!==TOK)throw STOP;await say(text,o);if(t!==TOK)throw STOP}
function pause(t,ms){return new Promise(r=>{timers.push(setTimeout(()=>{if(t===TOK)r()},ms))})}
function setLast(x){lastPrompt=x}
function run(fn){return()=>{fn().catch(e=>{if(e!==STOP)console.error(e)})}}
function speakSoft(t,text){speak(t,text).catch(()=>{})}
const scene=()=>$('.scene',stage);

  :`<div class="cloud" style="left:18px;top:${Math.round(h*.45)}px;width:${Math.round(w*.45)}px"></div><div class="sun" style="left:${w-62}px;top:16px"></div>`}</div>`;
function setBaby(el,mood,o={}){if(!el)return;el.innerHTML=babySVG(mood,o);el.classList.toggle('crying',mood==='crying');el.classList.toggle('happy',mood==='happy'||mood==='giggle')}
function burst(el,kinds,n=6){
  const r=loc(el);kinds=Array.isArray(kinds)?kinds:[kinds];
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='floater';d.innerHTML=FX[kinds[i%kinds.length]]();
    d.style.left=(r.x+r.w*rnd(.2,.8)-28)+'px';d.style.top=(r.y+r.h*rnd(.2,.6)-28)+'px';
    d.style.setProperty('--x',rnd(-60,60)+'px');d.style.animationDelay=(i*.08)+'s';
    fx.appendChild(d);setTimeout(()=>d.remove(),2400);
  }
}
function confetti(n=90){
  const cols=['#ff7eb6','#9b7bff','#ffd84d','#5ee0b5','#6cc8ff','#ff9f5a'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='conf';
    c.style.left=rnd(0,1180)+'px';c.style.background=cols[i%cols.length];
    c.style.setProperty('--d',rnd(2,3.6)+'s');c.style.setProperty('--x',rnd(-200,200)+'px');c.style.setProperty('--r',rnd(360,1080)+'deg');
    c.style.animationDelay=rnd(0,.6)+'s';fx.appendChild(c);setTimeout(()=>c.remove(),4600);
  }
}
function flyTo(fromEl,toEl,html){
  return new Promise(res=>{
    const a=loc(fromEl),b=loc(toEl),f=document.createElement('div');
    f.className='flyer';f.innerHTML=html;f.style.left=(a.x+a.w/2-55)+'px';f.style.top=(a.y+a.h/2-55)+'px';
    fx.appendChild(f);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${b.x+b.w/2-a.x-a.w/2}px,${b.y+b.h*.45-a.y-a.h/2}px) scale(.5)`;f.style.opacity='0'}));
    setTimeout(()=>{f.remove();res()},750);
  });
}
function tapOnce(t,el){
  return new Promise(res=>{
    el.classList.add('target');
    const h=()=>{if(t!==TOK)return;el.removeEventListener('click',h);el.classList.remove('target');res()};
    el.addEventListener('click',h);
  });
}
function choose(t,box,ids,correct,wrongFn){
  return new Promise(res=>{
    let busy=false;
    const ok=id=>Array.isArray(correct)?correct.includes(id):id===correct;
    box.innerHTML=ids.map((id,i)=>`<button class="choice" data-id="${id}" style="--bg:${ITEMS[id].bg};--sh:${ITEMS[id].sh};animation-delay:${i*.1}s"><div class="art">${ITEMS[id].art()}</div></button>`).join('');
    $$('.choice',box).forEach(b=>b.addEventListener('click',async()=>{
      if(busy||t!==TOK)return;const id=b.dataset.id;busy=true;
      if(ok(id)){
        b.classList.add('yes');sfx.ding();burst(b,'sparkle',6);
        $$('.choice',box).forEach(o=>{if(o!==b)o.classList.add('fade')});
        stopSpeech();await pause(t,800);res(id);
      }else{
        b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sfx.boing();
        const line=(wrongFn&&wrongFn(id))||ITEMS[id].no||'Hmm, not that one. Try again!';
        try{await speak(t,line)}catch(e){return}
        busy=false;
      }
    }));
  });
}
function holdOn(t,el,ms,{onProgress,nudge}={}){
  return new Promise(res=>{
    let start=0,raf=0,done=false,nudged=0;
    el.classList.add('target');
    const step=now=>{
      if(t!==TOK||done)return;
      const p=Math.min(1,(now-start)/ms);onProgress&&onProgress(p,now);
      if(p>=1){done=true;el.classList.remove('target');el.onpointerdown=el.onpointerup=el.onpointercancel=null;res();return}
      raf=requestAnimationFrame(step);
    };
    el.onpointerdown=e=>{if(done)return;try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.remove('target');start=performance.now();raf=requestAnimationFrame(step)};
    el.onpointerup=el.onpointercancel=()=>{
      if(done)return;cancelAnimationFrame(raf);onProgress&&onProgress(0,0);el.classList.add('target');
      if(nudge&&performance.now()-nudged>3500){nudged=performance.now();speakSoft(t,nudge)}
    };
  });
}
function addBubbleTo(layer,x,y,big){
  const b=document.createElement('div');b.className='bubble';const s=big?rnd(26,46):rnd(14,30);
  b.style.cssText=`left:${x}%;top:${y}%;width:${s}px;height:${s}px`;
  layer.appendChild(b);if(layer.children.length>60)layer.firstElementChild.remove();
}

    await reward(t,'feel',gameFeel);
  };
  await sp(intro);
}

/* ---- 10: love grows (new) ---- */
async function gameLove(){
  const t=newScene(`${win(70,90,190,150)}
    <div class="bigheart box" id="big" style="left:190px;top:60px;width:800px;height:620px">${s100(`<path d="${HEART_D}" fill="#FFC2DD"/>`)}</div>
    ${chr(parentSVG('mom'),110,225,180)}
    ${chr(sisterSVG('stand'),450,354,150,'','kid')}
    ${chr(babySVG('happy'),630,420,120,'hidden pop','baby')}
    <div class="abs hidden pop" id="basket" style="left:612px;top:500px;width:156px;height:62px;border-radius:0 0 78px 78px;background:repeating-linear-gradient(90deg,#E9B26B 0 14px,#D99A50 14px 18px);box-shadow:0 6px 0 rgba(59,42,90,.08)"></div>
    ${chr(parentSVG('dad'),870,225,180)}
    <button class="lheart" id="h1" aria-label="Big sister's heart" style="left:440px;top:120px;width:170px;height:160px;transform:scale(.45)">${s100(`<path d="${HEART_D}" fill="#FFD1E6" stroke="#fff" stroke-width="4"/>`)}</button>
    <button class="lheart hidden" id="h2" aria-label="Baby's heart" style="left:610px;top:220px;width:150px;height:140px;transform:scale(.4)">${s100(`<path d="${HEART_D}" fill="#FFD1E6" stroke="#fff" stroke-width="4"/>`)}</button>
    <div class="holdzone hidden" id="hz" style="left:330px;top:150px;width:520px;height:440px"><div class="holdring" style="left:110px;top:20px;width:300px;height:300px"></div></div>`,{room:'living'});
  const sp=(x,o)=>speak(t,x,o),w=ms=>pause(t,ms),h1=$('#h1'),h2=$('#h2'),baby=$('#baby');
  const fill=(el,n,max,from,to,base)=>{
    const p=Math.min(1,n/max),s=from+(to-from)*p;el.style.transform=`scale(${s})`;
    const c=['#FFD1E6','#FFB3D3','#FF94C1','#FF78B0','#FF5FA2','#F24A93'][Math.round(p*5)];
    $('path',el).setAttribute('fill',c);
  };
  const tapHeart=(el,max,from,to,onTap)=>new Promise(res=>{
    let n=0;el.classList.add('target');
    el.onclick=()=>{
      if(t!==TOK)return;n++;fill(el,n,max,from,to);sfx.note([523,587,659,698,784,880][Math.min(n-1,5)]);burst(el,['heart','heart2'],3);onTap&&onTap(n);
      if(n>=max){el.classList.remove('target');el.onclick=null;timers.push(setTimeout(()=>{if(t===TOK)res()},500))}
    };
  });
  await sp(`Mommy and Daddy love you so, so much!`);
  const q1=`Tap the heart to fill it up with love!`;
  setLast(q1);await sp(q1);
  await tapHeart(h1,5,.45,1);
  sfx.sparkle();
  await sp(`Wow! That's a big love!`);
  baby.classList.remove('hidden');$('#basket').classList.remove('hidden');sfx.ding();burst(baby,'sparkle',5);
  await sp(`Soon, ${S.baby.trim()||'baby sister'} will be here too!`);
  await sp(`Is there still enough love for you? Yes! Love isn't like a cookie. When you share a cookie, your piece gets smaller.`);
  await sp(`But when you share love, it gets bigger!`);
  h2.classList.remove('hidden');h2.classList.add('pop');
  const q2=`Tap ${B()}'s heart to fill it up!`;
  setLast(q2);await sp(q2);
  await tapHeart(h2,5,.4,1,n=>{h1.style.transform=`scale(${1+n*.04})`});
  await sp(`Look! ${B()}'s heart got big, and your heart got even bigger!`);
  $('#big').classList.add('show');sfx.sparkle();
  await sp(`There's a big heart for you, and a big heart for ${B()}. And you love her too!`);
  const hq=`Put your finger on our family and hold it, for a big family hug!`;
  setLast(hq);await sp(hq);
  const hz=$('#hz');hz.classList.remove('hidden');const ring=$('.holdring',hz);let lastH=0;
  await holdOn(t,hz,2200,{onProgress:(p,now)=>{ring.style.setProperty('--p',p);if(p>0&&now-lastH>300){lastH=now;burst(hz,['heart','heart2'],1)}},nudge:'Keep holding, for a big family hug!'});
  hz.classList.add('hidden');confetti(60);sfx.fanfare();
  await sp(`Our family is full of love. And it keeps on growing!`);
  await reward(t,'love',gameLove);
}

    ${chr(babySVG('giggle'),628,425,120,'happy')}
    <div class="abs" id="basket" style="left:610px;top:505px;width:156px;height:62px;border-radius:0 0 78px 78px;background:repeating-linear-gradient(90deg,#E9B26B 0 14px,#D99A50 14px 18px);box-shadow:0 6px 0 rgba(59,42,90,.08)"></div>
    ${chr(parentSVG('dad','wave'),820,206,190)}
    <div class="layer" id="sky"></div>`,{room:'start'});
  const sp=(x,o)=>speak(t,x,o),sky=$('#sky');
  sfx.fanfare();confetti(140);
  const cols=['#FF7EB6','#9B7BFF','#FFD84D','#5EE0B5','#6CC8FF','#FF9A62'];
  const launch=()=>{
    const b=document.createElement('button');b.className='balloon';b.setAttribute('aria-label','Balloon');
    b.innerHTML=ART.balloon(cols[Math.random()*cols.length|0]);
    b.style.left=rnd(20,1080)+'px';b.style.top='840px';b.style.pointerEvents='auto';b.style.animationDuration=rnd(6,9)+'s';b.style.setProperty('--r',rnd(-25,25)+'deg');
    b.onclick=()=>{sfx.pop();burst(b,['sparkle','star'],4);b.remove()};
    b.addEventListener('animationend',()=>b.remove());
    sky.appendChild(b);
  };
  sky.style.pointerEvents='none';
  timers.push(setInterval(launch,850));launch();
  await sp(`You did it, ${K()}! You learned so much about being a big sister.`);

  await sp(`You can help with diapers and bath time, sing her a lullaby, and tell Mommy and Daddy how you feel. And your family's love keeps growing!`);
  setLast(`Pop the balloons!`);
  await sp(`You are going to be the best big sister ever! Pop the balloons!`);
}

/* ---------- top bar ---------- */
$('#homeBtn').innerHTML=UI.home;$('#replayBtn').innerHTML=UI.speaker;
$('#homeBtn').onclick=()=>{sfx.pop();goHome()};
$('#replayBtn').onclick=()=>{initAudio();if(lastPrompt)say(lastPrompt)};

/* ---------- grown-up settings (press & hold the gear) ---------- */
function wireGear(){
  const g=$('#gear');if(!g)return;let tm=null;
  const stop=()=>{clearTimeout(tm);tm=null;g.classList.remove('pressing')};
  g.addEventListener('pointerdown',e=>{try{g.setPointerCapture(e.pointerId)}catch(_){}g.classList.add('pressing');tm=setTimeout(()=>{stop();sfx.pop();openSettings()},1200)});
  ['pointerup','pointercancel'].forEach(ev=>g.addEventListener(ev,stop));
  g.addEventListener('contextmenu',e=>e.preventDefault());
}
let draft={};
function swatches(el,list,key){
  el.innerHTML=list.map(c=>`<button type="button" data-c="${c}" aria-label="${c}" style="background:${c}" class="${draft[key]===c?'sel':''}"></button>`).join('');
  $$('button',el).forEach(b=>b.onclick=()=>{draft[key]=b.dataset.c;swatches(el,list,key)});
}
function openSettings(){
  stopSpeech();draft={skin:S.skin,hair:S.hair};
  $('#kidName').value=S.kid;$('#babyName').value=S.baby;
  const r=$('#rate');r.value=String(S.rate);if(r.value!==String(S.rate))r.value='0.92';
  swatches($('#skinSw'),SKINS,'skin');swatches($('#hairSw'),HAIRS,'hair');
  fillVoiceList();
  $('#voiceNote').textContent=hasTTS?`★ = higher-quality voice. More voices: iPad Settings → Accessibility → Spoken Content → Voices → English. The "Premium" ones sound best. If a Premium voice won't play when picked here (common in Safari on iPad), choose it as the voice in that iPad Settings screen, then pick "System default" here.`:'This browser has no built-in voice, so the game will be silent except for sound effects.';
  $('#settings').classList.remove('hidden');
}
function readSettings(){
  const vs=$('#voiceSel');if(vs&&vs.value){S.voiceName=vs.value;if(vs.value===SYS_VOICE)voice=null;else{const v=englishVoices().find(x=>x.name===vs.value);if(v)voice=v}}
  S.kid=$('#kidName').value.trim().slice(0,30);S.baby=$('#babyName').value.trim().slice(0,30);S.rate=parseFloat($('#rate').value)||0.92;
  if(draft.skin)S.skin=draft.skin;if(draft.hair)S.hair=draft.hair;save();
}
$('#voiceSel').onchange=()=>{readSettings();initAudio();say(`Hi, ${K()}! I'm the new voice.`)};
$('#testVoice').onclick=()=>{readSettings();initAudio();say(`Hi, ${K()}! Let's learn how to take care of ${B()}.`)};
$('#resetStars').onclick=()=>{S.stars=Object.fromEntries(ORDER.map(k=>[k,false]));save();$('#resetStars').textContent='Stickers reset ✓'};
$('#saveSet').onclick=()=>{readSettings();$('#settings').classList.add('hidden');$('#resetStars').textContent='Reset stickers';goHome()};

document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech()});
startScreen();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
